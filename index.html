<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neurofarmacología del Dolor | Atlas Interactivo 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-base: #080c16;
            --bg-panel: #111827;
            --border-color: rgba(255, 255, 255, 0.08);
            
            --color-somatic: #ef4444; /* Rojo: Dolor Somático */
            --color-visceral: #10b981; /* Verde: Dolor Visceral / Autonómico */
            --color-descending: #06b6d4; /* Cian: Inhibición Descendente */
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ----- HEADER ----- */
        header {
            padding: 1rem 2rem;
            background: rgba(8, 12, 22, 0.95);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .legend {
            display: flex;
            gap: 1.5rem;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .legend-item { display: flex; align-items: center; gap: 0.5rem; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.red { background-color: var(--color-somatic); box-shadow: 0 0 8px var(--color-somatic); }
        .dot.cyan { background-color: var(--color-descending); box-shadow: 0 0 8px var(--color-descending); }
        .dot.green { background-color: var(--color-visceral); box-shadow: 0 0 8px var(--color-visceral); }

        /* ----- MAIN LAYOUT ----- */
        .main-workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ----- SVG AREA ----- */
        .svg-container {
            flex: 1.2;
            position: relative;
            background: radial-gradient(circle at 50% 50%, #151e32 0%, #080c16 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        svg {
            width: 100%;
            height: 100%;
            max-height: 95vh;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6));
        }

        /* Interactive Nodes */
        .interactive-node {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .interactive-node circle.hitbox {
            fill: transparent;
            stroke: transparent;
            r: 35; /* Large invisible clickable area */
        }

        .interactive-node .core-node {
            transition: all 0.3s ease;
        }

        .interactive-node:hover .core-node {
            filter: brightness(1.5) drop-shadow(0 0 10px rgba(255,255,255,0.5));
            stroke-width: 3px;
            stroke: white;
            transform: scale(1.1);
        }

        .interactive-node:hover text {
            fill: #ffffff;
            font-weight: 700;
        }

        /* ----- INFO PANEL ----- */
        .info-panel {
            flex: 1;
            background: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: -15px 0 30px rgba(0,0,0,0.4);
            min-width: 450px;
        }

        .initial-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-muted);
            padding: 3rem;
        }

        .content-header {
            padding: 2rem 2.5rem 1.5rem;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), transparent);
        }

        .badge-container { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .badge-type-anatomy { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .badge-type-func { background: rgba(167, 139, 250, 0.15); color: #a78bfa; border: 1px solid rgba(167, 139, 250, 0.3); }

        /* Tabs */
        .tabs-nav {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.15);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .tab-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.02); }
        .tab-btn.active { color: white; }
        .tab-btn.active[data-target="fisiologia"] { border-color: #38bdf8; }
        .tab-btn.active[data-target="bloqueadores"] { border-color: #f87171; }
        .tab-btn.active[data-target="agonistas"] { border-color: #10b981; }

        /* Tab Content */
        .tab-content {
            padding: 2rem 2.5rem;
            overflow-y: auto;
            flex: 1;
            font-size: 1.05rem;
            line-height: 1.7;
            color: #d1d5db;
        }

        .tab-pane { display: none; animation: slideUp 0.3s ease forwards; }
        .tab-pane.active { display: block; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Content Styling */
        .tab-pane strong, .tab-pane b { color: white; font-weight: 600; }
        .tab-pane ul { padding-left: 1.5rem; margin-top: 0.5rem; list-style-type: disc; }
        .tab-pane li { margin-bottom: 1rem; }
        
        .drug-highlight {
            background: rgba(255,255,255,0.05);
            border-left: 3px solid;
            padding: 1.2rem;
            border-radius: 0 8px 8px 0;
            margin-bottom: 1.5rem;
        }
        .drug-highlight.blocker { border-color: #f87171; }
        .drug-highlight.agonist { border-color: #10b981; }
        
        .new-tag {
            background: rgba(16, 185, 129, 0.2); color: #34d399;
            border: 1px solid rgba(16,185,129,0.4);
            font-size: 0.7em; padding: 2px 6px; border-radius: 4px;
            margin-left: 8px; vertical-align: middle;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

    </style>
</head>
<body>

    <header>
        <div>
            <h1 class="text-xl font-bold tracking-tight">Neurofarmacología <span class="text-slate-400 font-normal text-base ml-2">Atlas Interactivo (Rev. 2026)</span></h1>
        </div>
        <div class="legend">
            <div class="legend-item"><div class="dot red"></div> Vía Ascendente (Dolor Somático)</div>
            <div class="legend-item"><div class="dot green"></div> Red Visceral (Vago/NTS)</div>
            <div class="legend-item"><div class="dot cyan"></div> Modulación Descendente</div>
        </div>
    </header>

    <div class="main-workspace">
        
        <div class="svg-container">
            <svg viewBox="0 0 1000 1200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1e293b" />
                        <stop offset="100%" stop-color="#0f172a" />
                    </linearGradient>
                    <radialGradient id="nucleusGrad" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#475569" />
                        <stop offset="100%" stop-color="#1e293b" />
                    </radialGradient>
                    
                    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="blur" /><feComposite in="SourceGraphic" in2="blur" operator="over" /></filter>
                    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="blur" /><feComposite in="SourceGraphic" in2="blur" operator="over" /></filter>
                    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="blur" /><feComposite in="SourceGraphic" in2="blur" operator="over" /></filter>
                </defs>

                <!-- ================= ANATOMÍA DE FONDO (Realista) ================= -->
                
                <!-- 1. Cerebro, Límbico e Hipotálamo -->
                <path d="M 400,100 C 250,100 250,350 350,420 C 400,450 450,450 480,450 C 650,450 750,350 700,200 C 650,50 500,100 400,100 Z" fill="url(#brainGrad)" stroke="#334155" stroke-width="2"/>
                <path d="M 500,100 Q 520,250 480,350 Q 550,320 560,110 Z" fill="#38bdf8" opacity="0.1"/> <!-- S1 -->
                <!-- Sistema Límbico (Cíngulo) -->
                <path d="M 450,220 C 400,220 380,270 420,320 C 450,350 520,320 550,280 C 580,240 500,220 450,220 Z" fill="#a855f7" opacity="0.1" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4,4"/>
                <!-- Hipotálamo (Origen descendente) -->
                <rect x="420" y="380" width="30" height="30" rx="5" fill="#facc15" opacity="0.15" stroke="#fef08a" stroke-width="1" stroke-dasharray="2,2"/>
                <text x="360" y="400" fill="#fef08a" font-size="11" opacity="0.7">Hipotálamo</text>

                <!-- 2. Tronco Encefálico (Detallado) -->
                <!-- Mesencéfalo, Puente, Bulbo -->
                <path d="M 480,450 C 450,450 470,550 450,600 C 430,650 440,750 480,800 L 520,800 C 560,750 570,650 550,600 C 530,550 550,450 520,450 Z" fill="url(#brainGrad)" stroke="#334155" stroke-width="2"/>
                <path d="M 450,600 Q 430,625 450,650" fill="none" stroke="#334155" stroke-width="2"/> <!-- Protuberancia -->
                
                <!-- 3. Médula Espinal Transversal -->
                <g transform="translate(500, 950)">
                    <ellipse cx="0" cy="0" rx="140" ry="90" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
                    <path d="M -5,88 L 5,88 L 5,30 L -5,30 Z" fill="#0f172a"/> <!-- Fisura -->
                    <path d="M -2,-88 L 2,-88 L 2,-50 L -2,-50 Z" fill="#0f172a"/> <!-- Surco post -->
                    <!-- Sustancia Gris (Mariposa) -->
                    <path d="M -15,0 C -50,-20 -90,-60 -110,-50 C -120,-40 -80,0 -40,10 C -60,40 -90,70 -70,80 C -50,90 -20,50 -10,30 C 0,25 0,25 10,30 C 20,50 50,90 70,80 C 90,70 60,40 40,10 C 80,0 120,-40 110,-50 C 90,-60 50,-20 15,0 Z" fill="#94a3b8" stroke="#475569"/>
                </g>

                <!-- 4. Piel / Periferia -->
                <rect x="50" y="860" width="160" height="180" rx="10" fill="#1e293b" stroke="#475569"/>
                <path d="M 50,920 Q 130,900 210,920" fill="none" stroke="#334155" stroke-width="1"/>
                <text x="60" y="885" fill="#fca5a5" font-size="12" opacity="0.5">Tejido (Piel/Víscera)</text>


                <!-- ================= VÍAS NEURONALES (Tractos) ================= -->

                <!-- A. VÍA ASCENDENTE SOMÁTICA (Rojo) -->
                <path id="tract-somatic" d="
                    M 130,900 
                    Q 150,850 250,920 
                    L 350,920 
                    Q 380,920 390,900 
                    L 450,900 
                    C 480,900 480,910 510,950 
                    C 530,950 550,950 580,920 
                    L 580,800 
                    L 580,400 
                    Q 580,300 530,220" 
                    fill="none" stroke="var(--color-somatic)" stroke-width="2.5" stroke-dasharray="5,5" filter="url(#glowRed)"/>
                
                <!-- B. RED VISCERAL Y NTS (Verde) -->
                <!-- Aferencia Vagal (Órganos -> NTS) -->
                <path id="tract-vagus" d="M 120,680 Q 250,650 460,680" fill="none" stroke="var(--color-visceral)" stroke-width="2" stroke-dasharray="4,4" filter="url(#glowGreen)"/>
                <text x="200" y="670" fill="#6ee7b7" font-size="11" opacity="0.7" font-style="italic">Nervio Vago (PC X)</text>
                
                <!-- Tracto Espinosolitario (Médula -> NTS directo) -->
                <path id="tract-spinosol" d="M 520,950 C 510,850 480,750 460,680" fill="none" stroke="var(--color-visceral)" stroke-width="1.5" stroke-dasharray="3,3"/>
                <text x="500" y="800" fill="#6ee7b7" font-size="10" opacity="0.6" font-style="italic">T. Espinosolitario</text>

                <!-- NTS -> PB -> Amígdala -->
                <path id="tract-nts-up" d="M 460,680 Q 470,600 470,550 Q 450,400 430,300" fill="none" stroke="var(--color-visceral)" stroke-width="2" stroke-dasharray="3,3" filter="url(#glowGreen)"/> 

                <!-- C. VÍA DESCENDENTE INHIBITORIA (Cian) -->
                <!-- Origen Cortical/Límbico -> Hipotálamo -> SGPA -> RVM -> Médula -->
                <path id="tract-descending" d="
                    M 430,300 
                    Q 440,350 440,390
                    Q 450,420 490,470 
                    Q 500,550 490,620 
                    L 480,800 
                    L 480,950 
                    C 460,950 420,920 390,900" 
                    fill="none" stroke="var(--color-descending)" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#glowCyan)"/>

                <!-- ANIMACIONES DE FLUJO (Puntos de luz) -->
                <circle r="4" fill="#ffffff" filter="url(#glowRed)"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#tract-somatic"/></animateMotion></circle>
                <circle r="3" fill="#ffffff" filter="url(#glowGreen)"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#tract-vagus"/></animateMotion></circle>
                <circle r="3" fill="#ffffff" filter="url(#glowGreen)"><animateMotion dur="4.5s" repeatCount="indefinite"><mpath href="#tract-nts-up"/></animateMotion></circle>
                <circle r="4" fill="#ffffff" filter="url(#glowCyan)"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#tract-descending"/></animateMotion></circle>


                <!-- ================= NODOS INTERACTIVOS ================= -->

                <!-- 1. Nociceptor -->
                <g class="interactive-node" onclick="loadData('nociceptor')">
                    <circle class="hitbox" cx="130" cy="900" />
                    <path d="M 130,900 L 110,880 M 130,900 L 135,870 M 130,900 L 150,880" fill="none" stroke="#ef4444" stroke-width="2"/>
                    <circle class="core-node" cx="130" cy="900" r="8" fill="#ef4444"/>
                    <text x="70" y="975" fill="#fca5a5" font-size="13">1. Nociceptor Periférico</text>
                </g>

                <!-- 2. Ganglio Raíz Dorsal -->
                <g class="interactive-node" onclick="loadData('nervio')">
                    <circle class="hitbox" cx="290" cy="920"/>
                    <rect x="200" y="915" width="30" height="10" rx="3" fill="#64748b"/>
                    <rect x="235" y="915" width="30" height="10" rx="3" fill="#64748b"/>
                    <circle class="core-node" cx="300" cy="910" r="14" fill="#818cf8"/>
                    <text x="250" y="885" fill="#a5b4fc" font-size="13">2. Ganglio Raíz Dorsal (GRD)</text>
                </g>

                <!-- 3. Asta Dorsal -->
                <g class="interactive-node" onclick="loadData('asta')">
                    <circle class="hitbox" cx="390" cy="900"/>
                    <circle class="core-node" cx="390" cy="900" r="10" fill="#ef4444" filter="url(#glowRed)"/>
                    <text x="320" y="860" fill="#fca5a5" font-size="13">3. Asta Dorsal / Decusación</text>
                </g>

                <!-- 4. NTS (Tracto Solitario) -->
                <g class="interactive-node" onclick="loadData('nts')">
                    <circle class="hitbox" cx="460" cy="680" />
                    <ellipse class="core-node" cx="460" cy="680" rx="14" ry="20" fill="#10b981"/>
                    <text x="260" y="685" fill="#6ee7b7" font-size="13">4. NTS (Integración Visceral)</text>
                </g>
                
                <!-- 5. Parabranquial -->
                <g class="interactive-node" onclick="loadData('pb')">
                    <circle class="hitbox" cx="470" cy="550" />
                    <circle class="core-node" cx="470" cy="550" r="9" fill="#34d399"/>
                    <text x="260" y="555" fill="#6ee7b7" font-size="13">5. N. Parabranquial (PB)</text>
                </g>

                <!-- 6. RVM / Locus Coeruleus -->
                <g class="interactive-node" onclick="loadData('rvm')">
                    <circle class="hitbox" cx="490" cy="620" />
                    <ellipse class="core-node" cx="490" cy="620" rx="15" ry="11" fill="#06b6d4" filter="url(#glowCyan)"/>
                    <text x="525" y="625" fill="#67e8f9" font-size="13">6. RVM / Locus Coeruleus</text>
                </g>

                <!-- 7. SGPA -->
                <g class="interactive-node" onclick="loadData('sgpa')">
                    <circle class="hitbox" cx="490" cy="470" />
                    <circle class="core-node" cx="490" cy="470" r="12" fill="#0ea5e9" filter="url(#glowCyan)"/>
                    <text x="520" y="475" fill="#7dd3fc" font-size="13">7. SGPA (Mesencéfalo)</text>
                </g>

                <!-- 8. Tálamo VPL -->
                <g class="interactive-node" onclick="loadData('talamo')">
                    <circle class="hitbox" cx="510" cy="360" />
                    <ellipse cx="510" cy="360" rx="25" ry="18" fill="url(#nucleusGrad)" stroke="#64748b"/>
                    <circle class="core-node" cx="505" cy="360" r="6" fill="#ef4444"/>
                    <text x="550" y="365" fill="#cbd5e1" font-size="13">8. Tálamo (VPL)</text>
                </g>

                <!-- 9. Límbico (Amígdala/Cíngulo) -->
                <g class="interactive-node" onclick="loadData('limbico')">
                    <circle class="hitbox" cx="430" cy="300" />
                    <circle class="core-node" cx="430" cy="300" r="12" fill="#a855f7"/>
                    <text x="220" y="305" fill="#c084fc" font-size="13">9. Límbico (Amígdala/Cíngulo)</text>
                </g>

                <!-- 10. Corteza S1 -->
                <g class="interactive-node" onclick="loadData('corteza')">
                    <circle class="hitbox" cx="530" cy="220" />
                    <path class="core-node" d="M 510,220 L 530,200 L 550,220 Z" fill="#38bdf8"/>
                    <text x="560" y="210" fill="#bae6fd" font-size="14" font-weight="600">10. Corteza Somatosensorial</text>
                </g>

            </svg>
        </div>

        <!-- ================= PANEL DE INFORMACIÓN (TABS) ================= -->
        <div class="info-panel">
            
            <div id="initial-message" class="initial-state">
                <svg class="w-16 h-16 mb-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                <h3 class="text-2xl font-bold text-slate-200 mb-2">Selecciona una Estructura</h3>
                <p class="text-sm text-slate-400 max-w-sm">Explora el diagrama anatómico a la izquierda haciendo clic en los nodos para revelar fisiología celular y farmacología actualizada.</p>
            </div>

            <div id="content-display" class="hidden h-full flex flex-col">
                
                <div class="content-header">
                    <h2 id="panel-title" class="text-2xl font-bold text-white mb-2">Título</h2>
                    <div id="panel-badges" class="badge-container"></div>
                </div>

                <div class="tabs-nav">
                    <button class="tab-btn active" data-target="fisiologia" onclick="switchTab(this)">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        Fisiología Celular
                    </button>
                    <button class="tab-btn" data-target="bloqueadores" onclick="switchTab(this)">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path></svg>
                        Bloqueadores
                    </button>
                    <button class="tab-btn" data-target="agonistas" onclick="switchTab(this)">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        Moduladores
                    </button>
                </div>

                <div class="relative flex-1 overflow-hidden flex flex-col">
                    <div id="tab-fisiologia" class="tab-pane active tab-content"></div>
                    <div id="tab-bloqueadores" class="tab-pane tab-content"></div>
                    <div id="tab-agonistas" class="tab-pane tab-content"></div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const db = {
            'nociceptor': {
                title: "Nociceptor (Terminal Periférica)",
                badges: [{text: "Transducción", type: "func"}, {text: "Fibras Aδ y C", type: "anatomy"}],
                fisiologia: `
                    <p>Las terminaciones nerviosas libres (sin cápsula) actúan como sensores primarios. Transforman un estímulo nocivo (mecánico, térmico extremo o químico) en un potencial de acción eléctrico.</p>
                    <br>
                    <strong>La Sopa Inflamatoria:</strong> Tras la lesión tisular, se liberan bradiquinina, histamina, prostaglandina E2 (PGE2), ATP y Factor de Crecimiento Nervioso (NGF). Estos mediadores sensibilizan a los receptores, reduciendo su umbral de activación (Hiperalgesia Primaria).
                    <br><br>
                    <strong>Receptores Moleculares:</strong>
                    <ul>
                        <li><b>TRPV1:</b> Canal iónico activado por calor nocivo (>43°C), pH ácido y capsaicina.</li>
                        <li><b>ASIC:</b> Canales sensibles al ácido del tejido inflamado o isquémico.</li>
                        <li><b>Nav1.7 y Nav1.8:</b> Canales de Sodio exclusivos del nociceptor. Fundamentales para disparar la señal eléctrica hacia el nervio.</li>
                    </ul>
                `,
                bloqueadores: `
                    <div class="drug-highlight blocker">
                        <h4 class="text-red-400 font-bold mb-1">Suzetrigina (VX-548) <span class="new-tag">Aprobación 2025</span></h4>

        function loadData(nodeKey) {
            document.getElementById('initial-message').style.display = 'none';
            document.getElementById('content-display').classList.remove('hidden');

            const data = db[nodeKey];
            if(!data) return;

            // Titulo y Badges
            document.getElementById('panel-title').innerText = data.title;
            const badgeContainer = document.getElementById('panel-badges');
            badgeContainer.innerHTML = data.badges.map(b => 
                `<span class="badge badge-type-${b.type}">${b.text}</span>`
            ).join('');

            // Llenar Tabs HTML
            document.getElementById('tab-fisiologia').innerHTML = data.fisiologia;
            document.getElementById('tab-bloqueadores').innerHTML = data.bloqueadores;
            document.getElementById('tab-agonistas').innerHTML = data.agonistas;

            // Reiniciar al Tab de fisiología
            document.querySelector('.tab-btn[data-target="fisiologia"]').click();
        }

        function switchTab(btnElement) {
            // Actualizar diseño de botones
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            // Actualizar paneles mostrados
            const targetId = btnElement.getAttribute('data-target');
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            document.getElementById(`tab-${targetId}`).classList.add('active');
        }
    </script>
